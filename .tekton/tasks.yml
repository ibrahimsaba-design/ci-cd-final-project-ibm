
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean the pipeline workspace
  workspaces:
    - name: source
  steps:
    - name: remove-files
      image: alpine:3
      env:
        - name: WORKSPACE
          value: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        if [ "$WORKSPACE" != "/workspace/source" ]; then
          echo "Unexpected workspace path"
          exit 1
        fi
        rm -rf "$WORKSPACE"/* "$WORKSPACE"/.[!.]* "$WORKSPACE"/..?*
        echo "Workspace cleaned"

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  description: Run Python unit tests using nose
  workspaces:
    - name: source
  steps:
    - name: run-tests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m venv /tmp/test-venv
        . /tmp/test-venv/bin/activate
        pip install -r requirements.txt
        nosetests -v
